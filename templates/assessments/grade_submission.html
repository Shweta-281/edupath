{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; padding: 32px;">
  <h2>Grade Submission</h2>
  <p style="color: var(--g500); margin-bottom: 24px;">Student: <strong>{{ submission.student.user.get_full_name|default:submission.student.user.username }}</strong></p>
  
  <a href="{{ submission.submitted_file.url }}" target="_blank" class="btn btn-outline" style="margin-bottom: 24px; display: inline-block;">View Submitted File</a>

  <form method="POST">
    {% csrf_token %}
    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; margin-bottom: 8px; display: block;">Grade (e.g., A, 9/10)</label>
      {{ form.grade }}
    </div>
    <div style="margin-bottom: 24px;">
      <label style="font-weight: 600; margin-bottom: 8px; display: block;">Feedback</label>
      {{ form.feedback }}
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Grade</button>
  </form>
</div>
{% endblock %}
