{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; padding: 32px; text-align: center;">
  <h2 style="margin-bottom: 8px;">Submit: {{ assignment.title }}</h2>
  <p style="color: var(--g500); margin-bottom: 24px;">Upload your completed work below.</p>
  
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div style="margin-bottom: 24px; text-align: left;">
      {{ form.submitted_file }}
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Upload Submission</button>
  </form>
</div>
{% endblock %}
